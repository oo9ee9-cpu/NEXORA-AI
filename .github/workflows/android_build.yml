name: Build NEXORA AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.nexoraai --project-name nexora_ai .

      - name: Configure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          old = "compileSdk = flutter.compileSdkVersion"
          if old not in s:
              raise SystemExit("Could not find generated compileSdk setting in android/app/build.gradle.kts")
          p.write_text(s.replace(old, "compileSdk = 36", 1))
          PY
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Ensure Android permissions
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Set APK version to workflow build number
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("pubspec.yaml")
          s = p.read_text()
          run = os.environ["GITHUB_RUN_NUMBER"]
          s, count = re.subn(r"(?m)^version:\s*[^\n]+$", f"version: 0.2.0+{run}", s, count=1)
          if count != 1:
              raise SystemExit("Could not update app version in pubspec.yaml")
          p.write_text(s)
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "NEXORA AI Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated release APK from commit ${GITHUB_SHA}. App build number: ${GITHUB_RUN_NUMBER}."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
